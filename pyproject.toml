[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisanvoice"
version = "0.1.0"
description = "KisanVoice API and NLP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pytest>=8.0.0",
  "spacy>=3.7.0",
]

[tool.setuptools]
packages = ["app", "app.nlp", "app.utils"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
